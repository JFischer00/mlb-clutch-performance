name: Deploy Data Collector Service

on:
  push:
    branches:
      - main
    paths:
      - 'applications/data-collector/**'
      - '!applications/data-collector/terraform/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Integration Tests
        run: |
          cd applications/data-collector
          ./gradlew test --no-daemon

      - name: Google Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build & Deploy Application
        id: deploy-cloud-run
        run: |
          gcloud builds submit applications/data-collector --pack=image=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{vars.COLLECTOR_SVC_NAME }},env=GOOGLE_RUNTIME_VERSION=21
          
          # Capture the generated URL from the deployment output
          RUN_URL=$(gcloud run deploy ${{vars.COLLECTOR_SVC_NAME }} \
            --image gcr.io/${{ vars.GCP_PROJECT_ID }}/${{vars.COLLECTOR_SVC_NAME }} \
            --region ${{ vars.GCP_REGION }} \
            --no-allow-unauthenticated \
            --add-cloudsql-instances=${{ vars.GCP_PROJECT_ID }}:${{ vars.GCP_REGION }}:${{ vars.DB_INSTANCE_NAME }} \
            --set-env-vars="SPRING_PROFILES_ACTIVE=gcp,CLOUD_SQL_CONNECTION_NAME=${{ vars.GCP_PROJECT_ID }}:${{ vars.GCP_REGION }}:${{ vars.DB_INSTANCE_NAME }},DB_NAME=${{ vars.DB_NAME }},DB_USERNAME=${{ secrets.DB_USERNAME }},DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            --format='value(status.url)')
          
          echo "SERVICE_URL=$RUN_URL" >> $GITHUB_ENV

      - name: Update Scheduler Target URL
        run: |
          gcloud scheduler jobs update http mlb-daily-sync \
            --uri="${{ env.SERVICE_URL }}/api/tasks/fetch-games" \
          --oidc-service-account-email="mlb-cron-invoker@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --location=${{ vars.GCP_REGION }}